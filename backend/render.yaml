services:
  - type: web
    name: reviewly-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./reviewai.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: CACHE_TTL_HOURS
        value: "12"
      - key: PYTHON_VERSION
        value: "3.11.6"
