services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: reviewly-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./reviewai.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: CACHE_TTL_HOURS
        value: "12"
      - key: PYTHON_VERSION
        value: "3.11.6"

  # 2. Vite React Frontend Static Site (Free, Global CDN, SPA rewrites)
  - type: web
    name: reviewly-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://product-review-ghmx.onrender.com/api/v1
